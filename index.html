background:white;

from{

to{

opacity:1;

transform:translateY(0);

}

}

h1{

font-family:"Cormorant Garamond",serif;

.fecha{

font-size:34px;

}

.hora{

margin-top:15px;

}

.lugar{

button,a{

}

}
